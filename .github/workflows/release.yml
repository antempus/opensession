# Fork release pipeline (antempus/opensession).
#
# Builds the four server tarballs install.sh downloads and publishes them in a
# SINGLE job: no draft, no Mac/Electron gate, no release-finalize step. The
# version is computed automatically (highest published vX.Y.Z on this repo,
# patch + 1; floor 0.4.70), so a release needs no hand-managed tag.
#
# Cut a release from the Actions tab -> "Release" -> "Run workflow" (leave the
# version blank for an automatic patch bump, or type one to override). Machines
# then pull it via install.sh from
#   https://github.com/antempus/opensession/releases/latest/download/opensession-<os>-<arch>.tar.gz
# and `opensession update` upgrades in place.
#
# scripts/build-compile.ts cross-compiles every target (bun --target), so one
# Linux runner builds all four. Pi is bundled into the binary; no engine seed.
name: Release

on:
  # Every push to the default branch cuts a release (auto patch bump). Keep the
  # default branch shippable; do development on branches and land finished work.
  # Docs-only pushes are skipped. workflow_dispatch stays as a manual escape
  # hatch and for explicit minor/major bumps via the version input.
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.5.0 (blank = auto patch bump)"
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    if: github.repository_owner == 'antempus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          floor="0.4.70"
          bump() { local v="$1"; echo "${v%.*}.$(( ${v##*.} + 1 ))"; }
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
          else
            latest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 \
              --json tagName \
              --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")]
                    | sort_by(split(".") | map(tonumber)) | last // empty')"
            if [ -z "$latest" ]; then version="$floor"; else version="$(bump "$latest")"; fi
          fi
          # Never collide with an existing tag or release; bump until free.
          while git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 \
                || gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            version="$(bump "$version")"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build artefacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/assets"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          for target in linux/x64 linux/arm64 darwin/x64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            bun scripts/build-compile.ts --version "$version" --os "$os" --arch "$arch" --out "$out"
            versioned="$out/opensession-$version-$os-$arch.tar.gz"
            test -s "$versioned"
            cp "$versioned" "$out/assets/"
            cp "$versioned" "$out/assets/opensession-$os-$arch.tar.gz"
          done
          cd "$out/assets"
          for asset in *.tar.gz; do
            hash="$(sha256sum "$asset" | awk '{ print $1 }')"
            printf '%s  %s\n' "$hash" "$asset" > "$asset.sha256"
          done
          ls -la "$out/assets"
      - name: Smoke-test Linux binary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          root="$RUNNER_TEMP/release-smoke"
          log="$root/server.log"
          kernel_log="$root/session-kernel.log"
          mkdir -p "$root"
          printf '%s\n' '{"provider":"local","publicIngress":{"enabled":true,"port":43860,"host":"127.0.0.1"}}' > "$root/sandbox.json"
          binary="$RUNNER_TEMP/release/stage/opensession-$version-linux-x64/opensession"
          common_env=(
            OPENSESSION_STATE_DIR="$root/state"
            OPENSESSION_SANDBOX_CONFIG="$root/sandbox.json"
            OPENSESSION_SESSION_KERNEL_PORT=43849
            OPENSESSION_SESSION_KERNEL_TOKEN=release-smoke-token
          )
          env "${common_env[@]}" "$binary" session-kernel-service > "$kernel_log" 2>&1 &
          kernel_pid=$!
          pid=""
          cleanup() {
            status=$?
            kill ${pid:+"$pid"} "$kernel_pid" 2>/dev/null || true
            if [ -n "$pid" ]; then wait "$pid" 2>/dev/null || true; fi
            wait "$kernel_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat "$kernel_log"
              test ! -f "$log" || cat "$log"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          # The gateway refuses an unseeded catalog; initialize the fresh smoke
          # fixture via the supported offline importer.
          env "${common_env[@]}" bun scripts/seed-session-metadata-catalog.ts
          env "${common_env[@]}" \
            OPENSESSION_MCP_HTTP_PORT=43852 \
            HOST=127.0.0.1 \
            PORT=43850 \
            OPENSESSION_PUBLIC_URL=http://127.0.0.1:43850 \
            "$binary" server > "$log" 2>&1 &
          pid=$!
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:43850/api/health > "$root/health.json"
          grep -Fq 'Frontend served from embedded assets' "$log"
      - name: Attest release archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/release/assets/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release/assets"
          gh release create "$TAG" "$assets"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Automated fork release $TAG. Server tarballs for install.sh." \
            --latest
          # Fail loudly if any asset did not land.
          uploaded="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[] | select(.state == "uploaded" and .size > 0)] | length')"
          echo "Uploaded $uploaded assets to $TAG"
          test "$uploaded" -eq 16
